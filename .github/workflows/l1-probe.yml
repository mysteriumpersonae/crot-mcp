name: "L1 probe (WP-23a D3/D4)"

on:
  workflow_dispatch:
  push:
    branches:
      - probe/l1-mechanism

permissions:
  contents: read

jobs:
  probe:
    name: "probe ${{ matrix.label }}"
    runs-on: ${{ matrix.label }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        label:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Probe
        run: bash .github/l1-probe/probe.sh "${{ matrix.label }}"
