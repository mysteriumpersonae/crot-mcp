# CROT production deployment for crot.network
# Run: docker compose -f compose.yml up -d
name: crot-production
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/tls:/config/tls:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - relay
    networks:
      - internal

  relay:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=0700,uid=10001,gid=10001"]
    expose:
      - "8443"
    volumes:
      - ./config:/config:ro
      - relay-state:/state
    environment:
      NODE_ENV: production
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - internal

  # Optional: simple landing page (Node static server or nginx serving HTML)
  landing:
    image: nginx:alpine
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./landing:/usr/share/nginx/html:ro
    networks:
      - internal

volumes:
  relay-state:
  nginx-logs:

networks:
  internal:
    driver: bridge
