# CROT nginx reverse proxy for crot.network
# TLS termination → relay (port 8443) and future landing (port 3000)

events { worker_connections 1024; }

http {
    # ── Security headers ──
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Rate limiting ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ── Logging ──
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ── SSL settings ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Redirect HTTP → HTTPS ──
    server {
        listen 80;
        server_name crot.network www.crot.network;
        return 301 https://crot.network$request_uri;
    }

    # ── Main HTTPS server ──
    server {
        listen 443 ssl;
        server_name crot.network;

        ssl_certificate     /config/tls/fullchain.pem;
        ssl_certificate_key /config/tls/privkey.pem;

        # ── MCP Relay endpoints → relay container ──
        location ~ ^(/d/|/.crot/|/.well-known/oauth-protected-resource|/portal) {
            limit_req zone=api burst=20 nodelay;
            limit_conn addr 32;

            proxy_pass http://relay:8443;
            proxy_http_version 1.1;

            # WebSocket support for tunnel
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Long timeouts for tunnel and MCP exchanges
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            proxy_connect_timeout 10s;

            # No buffering for streaming MCP
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ── Landing / download pages ──
        location / {
            # Static landing served by a separate container or files
            # Placeholder: return 302 to download page
            proxy_pass http://landing:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Health check ──
        location /.well-known/health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
